name: Review public CV media links
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - run: python scripts/archive_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: media-link-review
          path: dist-local/media/check.json
