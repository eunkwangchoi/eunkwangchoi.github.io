# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create local bin directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Read pinned toolchain versions
        run: |
          echo "HUGO_VERSION=$(python3 -c 'import json; print(json.load(open("scripts/toolchain.json"))["hugo"])')" >> "$GITHUB_ENV"
          echo "DART_SASS_VERSION=$(python3 -c 'import json; print(json.load(open("scripts/toolchain.json"))["dart_sass"])')" >> "$GITHUB_ENV"

      - name: Install Dart Sass
        run: |
          curl -fsSL -o "${{ runner.temp }}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xzf "${{ runner.temp }}/dart-sass.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Verify installations
        run: |
          hugo version
          sass --version

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-about.txt

      - name: Validate public About data
        run: |
          python -m pip install -r requirements-about.txt
          python scripts/validate_about.py
          python -m unittest discover -s tests
          python scripts/run_hugo.py --check

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          python scripts/run_hugo.py \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Generate shared citation data and rebuild
        run: |
          node scripts/build_citations.mjs
          python scripts/run_hugo.py --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build approved PDF variants
        run: |
          if python -c "import yaml,sys; sys.exit(0 if yaml.safe_load(open('data/me/profile.yaml'))['pdf']['enabled'] else 1)"; then
            npx playwright install --with-deps chromium
            node scripts/build_cv_pdf.mjs
          fi

      - name: Verify About output and blog isolation
        run: python scripts/check_about.py

      - name: Save Hugo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-diagnostics
          path: .build/hugo-logs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
