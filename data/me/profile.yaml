about:
  ko: 서울대학교에서 미학과 철학을 공부한 뒤 평론가 및 수필가로 활동하고 있습니다. 경남대학교 교양교육연구소와 교양융합대학에서 교수로 일했고,
    정부와 민간의 인공지능 관련 프로젝트에 몇 번 참여했습니다. 지금은 예술 스타트업인 아뜰리에 유로의 대표로서 기술과 예술의 융합을 도모하고
    있습니다. 멘사 회원이지만 회비는 잘 내지 않습니다.
  en: After studying aesthetics and philosophy at Seoul National University, I have
    been working as a critic and essayist. I served as a professor at Kyungnam University’s
    Institute of Liberal Arts Education and College of Liberal Arts and Convergence,
    and participated in several government and private-sector projects related to
    artificial intelligence. I now lead Atelier Euro, an arts startup, exploring the
    convergence of technology and art. I am a Mensa member, though I am not very good
    at paying the dues.
  ja: ソウル大学で美学と哲学を学びました。 慶南大学でしばらく教授職に就いていましたが、創作活動に専念するために教壇を降りました。 私の作品の多くは、まずテキストについて考えることから始まります。
    技術がめざましく進化する転換期のいま、メディア実験を通じて急速に変化するテキストの位相を探求しています。 ニュー・メディアを軸に据えながらも、伝統的なメディアを手放すつもりはありません。
